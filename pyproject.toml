[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-x-evaluator"
version = "0.1.0"
description = "Offline evaluation of language-model mental models of reinforcement-learning agents"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Wenhao Lu" },
  { name = "Xufeng Zhao" },
  { name = "Josua Spisak" },
  { name = "Jae Hee Lee" },
  { name = "Stefan Wermter" },
]
dependencies = [
  "numpy>=1.24,<3",
  "PyYAML>=6,<7",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
openai = ["openai>=1.0,<3"]
test = ["pytest>=7,<9"]

[project.scripts]
llm-x = "llm_x.cli:main"

[tool.setuptools.packages.find]
include = ["llm_x*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
